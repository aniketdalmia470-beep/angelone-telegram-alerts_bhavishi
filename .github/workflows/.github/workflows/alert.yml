name: AngelOne Telegram Alert
on:
  schedule:
    # Runs every 5 minutes, Mon-Fri, from 03:30 UTC (9:00 AM IST) to 10:25 UTC (3:55 PM IST)
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-holdings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AngelOne Telegram Alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_cloud_alert.py

      - name: Auto-save updated holdings_state.json
        run: |
          git config user.name "Alert Bot"
          git config user.email "bot@users.noreply.github.com"
          git add holdings_state.json
          git commit -m "Auto-update holdings state" || exit 0
          git push
