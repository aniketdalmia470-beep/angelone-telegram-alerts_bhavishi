name: AngelOne Telegram Alert
on:
  workflow_dispatch:

concurrency:
  group: angelone-alert-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-holdings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install smartapi-python pyotp requests logzero websocket-client openpyxl

      - name: Run AngelOne Telegram Alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
        run: python telegram_cloud_alert.py

      - name: Auto-save updated holdings_state.json
        run: |
          git config user.name "Alert Bot"
          git config user.email "bot@users.noreply.github.com"
          git add holdings_state.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update holdings state"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
